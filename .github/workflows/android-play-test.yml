name: Android → Play (on demand)
run-name: Play upload → ${{ inputs.track }} (${{ inputs.status }})${{ inputs.release_tag && format(' for {0}', inputs.release_tag) || '' }}

# Manual, isolated test of the Google Play publish pipeline. Builds the signed
# AAB from the current commit and uploads it to the chosen track (default:
# internal) WITHOUT running a full release — use it to verify the secrets and
# the service-account access before relying on the production auto-publish in
# the Release workflow.
#
# NOTE: Google Play rejects a versionCode that already exists for the package on
# ANY track. The version in src-tauri/tauri.conf.json must therefore be higher
# than anything already uploaded to Play — bump it first if a test upload fails
# with a "version code has already been used" error.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status"
        type: choice
        default: draft
        options: [draft, completed, inProgress, halted]
      release_tag:
        description: >
          Build this existing release tag instead of the branch head and
          attach the signed APK to its GitHub release (optional). The way to
          finish a release whose Play job failed, without bumping again.
        type: string
        default: ""

# `write`, not `read`: attaching the APK to an existing release needs it, and
# the called workflow caps its token at what the caller grants.
permissions:
  contents: write

jobs:
  publish:
    uses: NoiXdev/github-workflows/.github/workflows/publish_tauri_android_play.yaml@main
    secrets: inherit
    with:
      package_name: dev.noix.notefix
      track: ${{ inputs.track }}
      status: ${{ inputs.status }}
      release_tag: ${{ inputs.release_tag }}
