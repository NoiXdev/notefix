name: Release
run-name: Release ${{ inputs.bump }} for ${{ github.event.repository.name }}

# Dispatch-driven release. Run from the Actions tab, pick patch / minor / major,
# and the shared reusable workflow handles the rest: bump the version across all
# files, generate the changelog, commit + tag on main, and build & upload signed
# macOS (universal, with the embedded WidgetKit extension) / Windows / Linux
# artifacts. See NoiXdev/github-workflows for the reusable workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      dry_run:
        description: "Build everything but skip commit, tag, release and uploads"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: NoiXdev/github-workflows/.github/workflows/create_tauri_changelog_version_release.yaml@main
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      prerelease: ${{ inputs.prerelease }}
      dry_run: ${{ inputs.dry_run }}
      # Builds the universal app, embeds + inside-out-signs the WidgetKit
      # extension, notarizes, and prints DMG=<path> for upload.
      macos_build_script: scripts/macos-release.sh

  # Build the signed release AAB + APK: publish the AAB to Google Play
  # (production) and attach the signed release APK to the GitHub release.
  # Chained on the tag (not the release event) because a GITHUB_TOKEN release
  # does not fire `release: published`. Requires the ANDROID_KEYSTORE_* and
  # PLAY_SERVICE_ACCOUNT_JSON secrets (secrets: inherit). The app must already
  # have a manual first release in Play.
  play:
    needs: release
    if: ${{ inputs.dry_run == false }}
    uses: NoiXdev/github-workflows/.github/workflows/publish_tauri_android_play.yaml@main
    secrets: inherit
    with:
      package_name: dev.noix.notefix
      track: production
      release_tag: ${{ needs.release.outputs.tag }}
