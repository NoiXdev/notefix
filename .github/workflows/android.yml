name: Android APK
run-name: Android APK for ${{ github.event.release.tag_name || github.sha }}

# Builds a sideloadable debug APK for testing via the shared reusable workflow.
# On a published GitHub release the APK is attached to that release; otherwise
# it is available as a workflow artifact. No app-store publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    uses: NoiXdev/github-workflows/.github/workflows/build_tauri_android_apk.yaml@main
    secrets: inherit
