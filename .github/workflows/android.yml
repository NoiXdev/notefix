name: Android APK
run-name: Android APK${{ inputs.release_tag && format(' → {0}', inputs.release_tag) || '' }}

# On-demand debug APK build via the shared reusable workflow. Produces a
# downloadable artifact; optionally attaches it to an existing release tag.
# The release-time APK is built by the Release workflow itself (chained job),
# because a GITHUB_TOKEN release does not fire the `release: published` event.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the built APK to this existing release tag (optional)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  apk:
    uses: NoiXdev/github-workflows/.github/workflows/build_tauri_android_apk.yaml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
